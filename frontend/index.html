<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="AnonFit — a privacy-first health and workout companion. Your identity stays separate from your health data."
    />
    <meta name="theme-color" content="#070b14" />
    <title>AnonFit — Private by design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the persisted theme before paint to avoid a flash.
      (function () {
        try {
          var raw = localStorage.getItem("anonfit-theme");
          var theme = raw ? JSON.parse(raw).state.theme : "dark";
          document.documentElement.classList.toggle("dark", theme !== "light");
          document.documentElement.style.colorScheme = theme === "light" ? "light" : "dark";
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
